<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Views: home / player (one concept per scene, auto-advancing beats) / recall quiz / results. Player and quiz are full-screen fixed layouts. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface-2: #F5F6F8;
  --ink: #161D27;
  --ink-2: #465062;
  --muted: #586273;
  --line: #DCE1E8;
  --accent: #2C5C6A;
  --on-accent: #FFFFFF;
  --good: #2E6A4E;
  --good-bg: #E2EFE7;
  --bad: #9B3A3A;
  --bad-bg: #F6E5E3;
  --gold: #8C6D3A;
  --gold-bg: #F4EDE0;
  --mix: 0%;
  --shadow: 0 1px 2px rgb(20 28 40 / 0.05), 0 12px 32px rgb(20 28 40 / 0.07);
  --font: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --r: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --pop: cubic-bezier(.34, 1.45, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --surface: #151B23; --surface-2: #1B222C; --ink: #E7EAF0; --ink-2: #B7BECA; --muted: #8A93A3;
    --line: #29313C; --accent: #86B9C7; --on-accent: #0D1117; --good: #84C9A3; --good-bg: #1A2F25; --bad: #E89F97;
    --bad-bg: #3A2224; --gold: #D4B47C; --gold-bg: #2E2719; --mix: 38%;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #151B23; --surface-2: #1B222C; --ink: #E7EAF0; --ink-2: #B7BECA; --muted: #8A93A3;
  --line: #29313C; --accent: #86B9C7; --on-accent: #0D1117; --good: #84C9A3; --good-bg: #1A2F25; --bad: #E89F97;
  --bad-bg: #3A2224; --gold: #D4B47C; --gold-bg: #2E2719; --mix: 38%;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
b { font-weight: 650; }
:focus-visible { outline: 2px solid var(--cc, var(--accent)); outline-offset: 2px; }
.c { --cc: color-mix(in srgb, var(--c, var(--accent)), white var(--mix)); --cs: color-mix(in srgb, var(--cc) 13%, transparent); --cl: color-mix(in srgb, var(--cc) 30%, transparent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }

/* ---------- shared buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 16px; font-weight: 500; text-decoration: none;
  transition: transform .15s var(--ease), background .2s, border-color .2s;
}
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--cc, var(--accent)); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[disabled] { opacity: .4; cursor: default; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 999px; border: 1px solid transparent; background: transparent;
  display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2);
}
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- home ---------- */
.home {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px;
  display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr);
}
.h-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 300; font-size: 20px; letter-spacing: .14em; }
.brand span { color: var(--muted); }
.dchip {
  font-size: 13px; font-weight: 600; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  border-radius: 999px; padding: 3px 12px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.hero {
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow);
  padding: 40px 24px 28px; text-align: center; display: grid; gap: 14px; justify-items: center;
  background-image: radial-gradient(120% 80% at 50% 0%, var(--cs), transparent 70%);
}
.bigplay {
  width: 132px; height: 132px; border-radius: 999px; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--cc); color: var(--on-accent);
  box-shadow: 0 0 0 10px var(--cs), 0 18px 40px -12px color-mix(in srgb, var(--cc) 70%, transparent);
  transition: transform .2s var(--pop);
  animation: breathe 3.2s ease-in-out infinite;
}
.bigplay:hover { transform: scale(1.04); }
.bigplay:active { transform: scale(.96); }
.bigplay svg { width: 52px; height: 52px; margin-left: 8px; }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 10px var(--cs), 0 18px 40px -12px color-mix(in srgb, var(--cc) 70%, transparent); } 50% { box-shadow: 0 0 0 18px color-mix(in srgb, var(--cc) 8%, transparent), 0 18px 40px -12px color-mix(in srgb, var(--cc) 70%, transparent); } }
.hero-t { font-size: clamp(22px, 5.4vw, 28px); font-weight: 350; margin-top: 10px; line-height: 1.35; }
.hero-t small { display: block; font-size: 15px; color: var(--muted); font-weight: 400; margin-bottom: 4px; letter-spacing: .04em; }
.hero-s { color: var(--ink-2); font-size: 15px; }
.restart { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }
.setrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
.pill {
  min-height: 40px; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.pill.on { border-color: var(--cl); background: var(--cs); color: var(--cc); }
.pill svg { width: 16px; height: 16px; }
.vselect { min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); padding: 6px 12px; font-size: 14px; max-width: 220px; }
.vnote { font-size: 13px; color: var(--muted); max-width: 440px; }
.sec-t { font-size: 13px; letter-spacing: .12em; color: var(--muted); text-align: center; margin: 0 0 -12px; }
.chs { display: grid; gap: 14px; }
.chc {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 18px 18px 18px 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center;
  position: relative; overflow: hidden;
}
.chc::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--cc); }
.chc-num { grid-row: span 2; width: 46px; height: 46px; border-radius: 999px; background: var(--cs); color: var(--cc); display: grid; place-items: center; font-size: 20px; font-weight: 300; }
.chc-name { font-size: 20px; font-weight: 500; line-height: 1.3; }
.chc-meta { font-size: 13px; color: var(--muted); }
.chc-bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.chc-bar i { display: block; height: 100%; background: var(--cc); border-radius: 99px; transition: width .6s var(--ease); }
.chc-stat { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px 14px; flex-wrap: wrap; }
.chc-stat .bad { color: var(--bad); font-weight: 600; }
.chc-stat .good { color: var(--good); font-weight: 600; }
.chc-act { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.chc-act .btn { min-height: 42px; padding: 8px 16px; font-size: 15px; }
.weak {
  display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
  background: var(--bad-bg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent);
  border-radius: var(--r); padding: 16px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%;
}
.weak svg { width: 20px; height: 20px; }
.foot { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.7; }

/* ---------- player + quiz shell ---------- */
.shell {
  position: fixed; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; z-index: 2;
  background: radial-gradient(120% 55% at 50% 0%, var(--cs), transparent 72%), var(--bg);
}
.bar {
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
}
.bar-t { flex: 1; min-width: 0; text-align: center; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.bar-t b { color: var(--cc); font-weight: 600; }
.bar .spacer { width: 44px; flex: none; }
.prog { display: flex; gap: 3px; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); max-width: 820px; width: 100%; margin: 0 auto; }
.prog i { flex: 1; height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; position: relative; }
.prog i::after { content: ""; position: absolute; inset: 0; width: var(--f, 0%); background: var(--cc); border-radius: 99px; transition: width .45s var(--ease); }
.prog i.bad::after { background: var(--bad); }
.prog i.good::after { background: var(--good); }
.stage { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-behavior: smooth; }
.ctrl {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px));
  border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.playbtn {
  width: 64px; height: 64px; border-radius: 999px; border: 0; background: var(--cc); color: var(--on-accent); cursor: pointer;
  display: grid; place-items: center; margin: 0 8px; box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--cc) 80%, transparent);
  transition: transform .15s var(--pop);
}
.playbtn:active { transform: scale(.93); }
.playbtn svg { width: 28px; height: 28px; }
.playbtn .i-play { margin-left: 4px; }
.ctrl .pill { min-height: 38px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.ctrl .iconbtn { color: var(--ink); }
.ctrl .side { display: flex; gap: 6px; align-items: center; }
.speaking { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.speaking i { width: 3px; background: currentColor; border-radius: 2px; animation: eq 1s ease-in-out infinite; height: 40%; }
.speaking i:nth-child(2) { animation-delay: .2s; } .speaking i:nth-child(3) { animation-delay: .4s; }
@keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
.paused .speaking i { animation: none; height: 30%; }

/* ---------- scenes ---------- */
.scene { min-height: 100%; display: flex; flex-direction: column; transition: opacity .26s var(--ease), transform .26s var(--ease); }
.scene.leave { opacity: 0; transform: translateY(-10px); }
.scene.enter { opacity: 0; transform: translateY(12px); }
.scene-in {
  margin: auto; width: 100%; max-width: 760px; text-align: center;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 36px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr);
}
.kick { font-size: 13px; letter-spacing: .12em; color: var(--cc); font-weight: 600; }
.title { margin: 0; font-size: clamp(32px, 8vw, 48px); font-weight: 250; line-height: 1.2; letter-spacing: -.01em; transition: font-size .5s var(--ease); }
.one { margin: 0 auto; max-width: 620px; font-size: clamp(19px, 4.8vw, 25px); font-weight: 350; line-height: 1.6; color: var(--ink); transition: font-size .5s var(--ease); }
.one b, .hk b, .warn b {
  font-weight: 650; color: var(--ink);
  background: linear-gradient(transparent 58%, color-mix(in srgb, var(--cc) 34%, transparent) 58%) no-repeat 0 0 / 0% 100%;
  transition: background-size .9s .35s var(--ease); padding: 0 2px; border-radius: 2px;
}
.one.on b, .hk.on b, .on .hk b, .warn.on b { background-size: 100% 100%; }
.compact .title { font-size: clamp(24px, 5.6vw, 32px); }
.compact .one { font-size: clamp(16px, 3.9vw, 19px); color: var(--ink-2); }
.visbox:empty, .vis { display: none; }
.vis.act { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); animation: visin .5s var(--ease); }
@keyframes visin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.recap { display: none; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.recap.act { display: grid; animation: visin .5s var(--ease); }

/* reveal animation */
.rv { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(5px); transition: opacity .55s var(--ease), transform .6s var(--pop), filter .5s var(--ease), box-shadow .35s var(--ease), background-color .35s; }
.rv.on { opacity: 1; transform: none; filter: none; }
.dim .rv.on.past { opacity: .5; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.rv.on.now.box, .rv.on.now .box { border-color: var(--cl); box-shadow: 0 0 0 2px var(--cl), 0 14px 34px -16px color-mix(in srgb, var(--cc) 65%, transparent); }
.vt { font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
@media (prefers-reduced-motion: reduce) {
  .rv { transform: none !important; filter: none !important; transition: opacity .3s; }
  .bigplay { animation: none; }
}

/* tiles */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
.tile { padding: 16px 12px; font-size: 16px; font-weight: 500; line-height: 1.4; display: grid; place-items: center; min-height: 64px; }
.tile .tn { display: block; font-size: 12px; color: var(--cc); font-weight: 600; margin-bottom: 2px; }
@media (max-width: 560px) { .tiles { --cols: 2 !important; } }

/* groups */
.groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.grp { padding: 18px 16px 16px; display: grid; gap: 8px; align-content: start; position: relative; overflow: hidden; }
.grp::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--cc); opacity: .7; }
.gname { font-size: 19px; font-weight: 600; line-height: 1.35; }
.gtag { justify-self: center; font-size: 13px; color: var(--cc); background: var(--cs); border-radius: 999px; padding: 2px 10px; font-weight: 500; }
.grp ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.grp li { font-size: 15px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 7px 10px; line-height: 1.45; }

/* steps */
.steps { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 10px; width: 100%; max-width: 600px; text-align: left; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 16px; }
.sn { width: 40px; height: 40px; border-radius: 999px; background: var(--cs); color: var(--cc); display: grid; place-items: center; font-size: 18px; font-weight: 400; }
.step > div > b { display: block; font-size: 17px; line-height: 1.4; }
.step > div > span { display: block; font-size: 15px; color: var(--muted); line-height: 1.5; }

/* vs comparison */
.vs { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.vs-h { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 16px; align-items: stretch; }
.vs-l, .vs-r { border-radius: var(--r); padding: 14px 10px; font-size: 18px; font-weight: 600; line-height: 1.35; display: grid; place-items: center; gap: 6px; position: relative; transition: box-shadow .4s, transform .5s var(--pop); }
.vs-l { background: var(--cc); color: var(--on-accent); }
.vs-r { background: color-mix(in srgb, var(--ink) 78%, var(--bg)); color: var(--bg); }
.vs-mid { align-self: center; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .1em; }
.vs-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.vs-lab { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-top: 6px; }
.vs-a, .vs-b { padding: 12px 12px; font-size: 15px; line-height: 1.5; display: grid; place-items: center; min-height: 52px; }
.vs-a:empty, .vs-b:empty { visibility: hidden; }
.win { font-size: 12px; font-weight: 700; background: var(--gold); color: var(--on-accent); border-radius: 999px; padding: 2px 10px; letter-spacing: .02em; }
.vs.won-left .vs-l, .vs.won-right .vs-r { box-shadow: 0 0 0 3px var(--gold-bg), 0 0 0 5px var(--gold); transform: scale(1.03); }
.vs.won-left .vs-a, .vs.won-right .vs-b { border-color: color-mix(in srgb, var(--gold) 55%, transparent); background: var(--gold-bg); }

/* flow */
.flow { display: grid; justify-items: center; gap: 0; }
.node { padding: 13px 22px; font-size: 17px; font-weight: 500; line-height: 1.45; max-width: 520px; width: fit-content; }
.flow .node:last-child { background: var(--cs); border-color: var(--cl); font-weight: 650; }
.arr { display: block; color: var(--cc); height: 30px; display: grid; place-items: center; }
.arr svg { width: 20px; height: 20px; }
.branch { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); margin-top: 6px; }
.br { padding: 16px; display: grid; gap: 6px; border-top: 4px solid var(--muted); }
.br-good { border-top-color: var(--good); }
.br-bad { border-top-color: var(--bad); }
.br-c { font-size: 15px; color: var(--ink-2); line-height: 1.5; }
.br-r { font-size: 17px; font-weight: 650; line-height: 1.45; }
.br-good .br-r { color: var(--good); }
.br-bad .br-r { color: var(--bad); }
.br .arr { height: 20px; }

/* rows (chains) */
.crows { display: grid; gap: 10px; }
.crow { padding: 14px; display: grid; gap: 10px; }
.crow-lab { font-size: 14px; font-weight: 600; color: var(--cc); }
.chain { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 4px; }
.cbox { background: var(--surface-2); border-radius: 10px; padding: 7px 12px; font-size: 15px; font-weight: 500; }
.carr { color: var(--muted); display: inline-grid; place-items: center; }
.carr svg { width: 18px; height: 18px; }

/* bars */
.bars { display: grid; grid-template-columns: minmax(56px, max-content) minmax(0, 1fr) max-content; gap: 14px 10px; text-align: left; width: 100%; max-width: 620px; margin: 0 auto; }
.barrow { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; position: relative; }
.bl { font-size: 15px; font-weight: 500; text-align: right; max-width: 34vw; overflow-wrap: break-word; word-break: normal; hyphens: auto; }
.bt { height: 30px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.bt i { display: block; height: 100%; width: 0; background: var(--cc); border-radius: 8px; transition: width 1s .1s var(--ease); }
.barrow.on .bt i { width: var(--w); }
.bv { font-size: 18px; font-weight: 300; font-variant-numeric: tabular-nums; }
.star { grid-column: 2 / -1; font-size: 14px; font-weight: 600; color: var(--gold); background: var(--gold-bg); border-radius: 999px; padding: 3px 12px; justify-self: start; }

/* big numbers */
.bigs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.big { padding: 22px 16px; display: grid; gap: 8px; align-content: center; }
.bn { font-size: clamp(44px, 12vw, 64px); font-weight: 200; line-height: 1.05; color: var(--cc); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bn.txt { font-size: clamp(24px, 6vw, 30px); font-weight: 400; letter-spacing: 0; line-height: 1.3; }
.bc { font-size: 15px; color: var(--ink-2); line-height: 1.55; }

/* triangle */
.tri { width: 100%; max-width: 420px; margin: 0 auto; display: block; overflow: visible; }

    NAR.timer = setTimeout(function () { if (tok !== NAR.tok) return; try { p.pause(); } catch (e) {} over(); }, secs * 1000 + 4000);
    var pr;
    try { pr = p.play(); } catch (e) { fail(); return; }

      if (tok !== NAR.tok || ended) return;

  function speakSys(text, tok, fin) {
    if (tok !== NAR.tok) return;

    var list = chunks(text), idx = 0, v = pickVoice();
    function next() {
      if (tok !== NAR.tok) return;

  /* ---------- view routing ---------- */

  }

    jump: function (id, b) {
      var ix = CARD[id]; if (!ix) return false;
      stopPlay(); P.list = null; P.ch = ix.ch; P.ci = ix.ci; P.b = 0;
      if (view !== "play") openPlayer(true); else renderScene(false);
      P.b = Math.max(0, Math.min(b || 0, ix.card.beats.length - 1)); applyBeat(); updateCtrl();
      return ix.card.beats[P.b];
    },
    state: function () { var sc = curScene(); return { view: view, ch: P.ch, ci: P.ci, li: P.li, b: P.b, playing: P.playing, kind: sc.kind, n: sceneBeats(sc).length }; },
    cards: function () { return Object.keys(CARD); },
    voice: function () { return { hasRec: hasRec, rec: recMode(), recBlocked: recBlocked, clips: Object.keys(AUDIO).length, playing: !!(player && !player.paused) }; }
  };

  renderHome();
  if (location.hash && location.hash !== "#home") { try { history.replaceState(null, "", "#home"); } catch (e) {} }
})();
</script>
